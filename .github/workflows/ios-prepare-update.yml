# Prepares the editable ("Prepare for Submission") App Store version for an update: version number, What's New, newest build.
# Runs when this file changes on this branch, or by hand. It never submits for review.
name: iOS prepare update
on:
  workflow_dispatch:
  push:
    branches: [claude/zombie-smash-deployment-stores-mk88wq]
    paths: [.github/workflows/ios-prepare-update.yml, appstore/prepare_update.rb]
concurrency:
  group: ios-prepare-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.thejoeyrob.zombiesmash2' }}
      NEW_VERSION: ${{ vars.IOS_APP_VERSION || '1.0.1' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem install fastlane --no-document
      - run: ruby appstore/prepare_update.rb
