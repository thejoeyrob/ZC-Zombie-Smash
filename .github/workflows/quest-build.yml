# Builds the Zombie Smash VR app for Meta Quest (Godot 4, OpenXR) and uploads the APK as an artifact.
# Run manually: Actions -> "Quest VR build" -> Run workflow. The engine port is checked tick-for-tick against engine.js first.
name: Quest VR build

on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch, so pushing to this branch also runs it.
  push:
    branches: [quest-build]

permissions:
  contents: write      # lets the build attach the finished APK to the "quest-latest" test release

concurrency:
  group: quest-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  GODOT_BUILDS: "https://github.com/godotengine/godot-builds/releases/download"
  VENDORS_TAG: "4.0.0-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and its export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -fsSL -o godot.zip "$GODOT_BUILDS/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          curl -fsSL -o templates.tpz "$GODOT_BUILDS/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" && unzip -q templates.tpz -d tpl && cp -r tpl/templates/* "$T/"
          ls "$T" | head -30
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Prepare game data and art
        shell: bash
        run: |
          set -euo pipefail
          quest/tools/sync-assets.sh
          node quest/tools/golden.mjs | tail -3

      - name: Point the game at the room server
        env:
          SHACK_ENDPOINT: ${{ vars.SHACK_ENDPOINT }}
        run: |
          # the address of the deployed room server (wss://HOST/shack), kept as a repository variable; empty means rooms say "not configured"
          python3 - <<'PY'
          import json, os
          p = "quest/config/shack.json"
          d = json.load(open(p))
          d["endpoint"] = os.environ.get("SHACK_ENDPOINT", "").strip()
          json.dump(d, open(p, "w"))
          print("room server:", d["endpoint"] or "(not set)")
          PY
      - name: Test the room server
        run: node --test server/tests/*.test.mjs

      - name: Import the project
        shell: bash
        run: |
          cd quest
          godot --headless --import || true
          # mipmaps on for every picture, so far-away detail stays smooth instead of shimmering in the headset
          grep -l 'importer="texture"' assets/art/*.import | xargs sed -i 's/^mipmaps\/generate=false/mipmaps\/generate=true/'
          # and for the lettering too: signs and labels read from across the room without breaking into jagged pixels
          sed -i 's/^generate_mipmaps=false/generate_mipmaps=true/' assets/fonts/*.import || true
          bash ../quest/tools/compress-textures.sh assets/art
          godot --headless --import

      - name: Check the engine port against the JavaScript engine
        shell: bash
        run: |
          cd quest
          godot --headless -s tests/trace.gd

      - name: Get the Meta Quest (OpenXR vendors) plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$VENDORS_TAG" --repo GodotVR/godot_openxr_vendors --pattern 'godotopenxrvendorsaddon.zip' --dir vendors
          mkdir -p x && unzip -q vendors/godotopenxrvendorsaddon.zip -d x
          SRC="$(find x -type d -name godotopenxrvendors | head -1)"
          echo "plugin folder: $SRC"
          mkdir -p "$GITHUB_WORKSPACE/quest/addons"
          cp -r "$SRC" "$GITHUB_WORKSPACE/quest/addons/"
          find "$GITHUB_WORKSPACE/quest/addons/godotopenxrvendors" -maxdepth 3 | head -60
          find "$GITHUB_WORKSPACE/quest/addons" -name 'plugin.cfg' -o -name 'export_plugin*' | head

      - name: Android SDK, build template and debug key
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709" >/dev/null
          # one fixed signing key for every build, so each new install updates the old one in place (a debug key, nothing secret)
          cp quest/tools/vr-debug.keystore "$RUNNER_TEMP/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.4.tres"
          # the Android build template (what the editor's "Install Android Build Template" does)
          cd quest
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      # ---- the emulator: a plug-in and the open-source cores (pinned commits, see quest/native), built first so the main app can carry them ----
      - name: Build the emulator plug-in and cores
        id: native
        # A successful APK must not conceal a broken or zero-core emulator build.
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq scons >/dev/null
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_ROOT="$SDK/ndk/28.1.13356709"
          ls "$ANDROID_NDK_ROOT" | head -3
          cd quest/native
          ./build-native.sh android
          ./build-cores.sh android
          test -s ../bin/cores/libfceumm_libretro.so
          ./make-gdextension.sh

      - name: Export the APK (with the emulators when they built)
        shell: bash
        run: |
          set -euo pipefail
          cd quest
          mkdir -p build
          # every build gets its own number, so a new install is never mistaken for an old one
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.${GITHUB_RUN_NUMBER}.0\"/" export_presets.cfg
          echo "{\"build\": ${GITHUB_RUN_NUMBER}}" > build.json
          if [ "${{ steps.native.outcome }}" = "success" ]; then
            echo "main app: with the emulator plug-in and cores"
          else
            echo "main app: the emulator did not build, so this one has the emulator menu switched off (see the build log)"
            sed -i 's/^const ENABLED := true/const ENABLED := false/' scripts/emu_launcher.gd
          fi
          godot --headless --import || true
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ]; then
            # the real store key: builds signed like this can go to the Meta store
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="fattysgameshack"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            godot --headless --verbose --export-release "Meta Quest" build/zombie-smash-vr.apk 2>&1 | grep -viE "^\s*(first_scan|_update_scan|loading_editor)" | tail -80
          else
            godot --headless --verbose --export-debug "Meta Quest" build/zombie-smash-vr.apk 2>&1 | grep -viE "^\s*(first_scan|_update_scan|loading_editor)" | tail -80
          fi
          cp build/zombie-smash-vr.apk "build/ZombieSmashVR-build${GITHUB_RUN_NUMBER}.apk"
          unzip -l build/zombie-smash-vr.apk | grep -E "libretro" || true
          python3 tools/check-emulator-apk.py build/zombie-smash-vr.apk
          ls -la build
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      # a second copy with no emulator at all, kept ready in case a store review ever objects to the emulators
      - name: Export the no-emulator APK (fallback)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd quest
          rm -rf bin
          sed -i 's/^const ENABLED := true/const ENABLED := false/' scripts/emu_launcher.gd
          godot --headless --import || true
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="fattysgameshack"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            godot --headless --verbose --export-release "Meta Quest" build/no-emulator.apk 2>&1 | grep -viE "^\s*(first_scan|_update_scan|loading_editor)" | tail -40
          else
            godot --headless --verbose --export-debug "Meta Quest" build/no-emulator.apk 2>&1 | grep -viE "^\s*(first_scan|_update_scan|loading_editor)" | tail -40
          fi
          unzip -l build/no-emulator.apk | grep -E "libretro" && echo "UNEXPECTED: emulator libraries in the fallback" || echo "fallback has no emulator libraries"
          ls -la build
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Show what the APK declares (headset support, permissions)
        continue-on-error: true
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 | tail -1)"
          echo "using $AAPT2"
          "$AAPT2" dump badging quest/build/zombie-smash-vr.apk | grep -vE "application-label|application-icon|densities|locales|supports-" | head -60 || true
          echo "--- manifest lines about VR / Quest ---"
          "$AAPT2" dump xmltree --file AndroidManifest.xml quest/build/zombie-smash-vr.apk | grep -iE "oculus|headtracking|openxr|supportedDevices|vr\.|category|intent" | head -30 || true
          unzip -l quest/build/zombie-smash-vr.apk | grep -E "libopenxr|libgodot|\.pck" | head || true

      - uses: actions/upload-artifact@v4
        with:
          name: zombie-smash-vr-apk
          path: quest/build/ZombieSmashVR-build*.apk
          if-no-files-found: error

      # A plain, unzipped APK at one fixed address, so it can be opened in the Quest browser and saved straight to Files.
      - name: Publish the APK as the latest test download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "quest/build/ZombieSmashVR-build${GITHUB_RUN_NUMBER}.apk" FattysGameShack-Quest.apk
          NOTES="Build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}) of the Fatty's Game Shack Quest VR test build. Download FattysGameShack-Quest.apk and install it on a Quest in developer mode."
          gh release view quest-latest >/dev/null 2>&1 || gh release create quest-latest --prerelease --target "$GITHUB_SHA" --title "Fatty's Game Shack - Quest test build" --notes "$NOTES"
          gh release upload quest-latest FattysGameShack-Quest.apk --clobber
          gh release delete-asset quest-latest FattysGameShack-Quest-Emulator.apk -y 2>/dev/null || true
          if [ -f quest/build/no-emulator.apk ]; then
            cp quest/build/no-emulator.apk FattysGameShack-Quest-NoEmulator.apk
            gh release upload quest-latest FattysGameShack-Quest-NoEmulator.apk --clobber
            NOTES="$NOTES FattysGameShack-Quest.apk has the emulators (NES, SNES, Mega Drive, Master System, Game Gear, Game Boy, Game Boy Color, Game Boy Advance, PC Engine, Atari 2600, 7800, Lynx) built in; FattysGameShack-Quest-NoEmulator.apk is the same game with none, kept in case a store review objects."
          else
            gh release delete-asset quest-latest FattysGameShack-Quest-NoEmulator.apk -y 2>/dev/null || true
          fi
          gh release edit quest-latest --notes "$NOTES"
